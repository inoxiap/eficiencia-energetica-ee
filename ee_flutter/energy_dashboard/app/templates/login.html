{% extends "base.html" %}
{% block title %}Acceso administrador | EE{% endblock %}
{% block body %}
<main class="login-shell">
  <section class="login-panel">
    <div class="brand-mark">EE</div>
    <h1>Panel de eficiencia energetica</h1>
    <p>Acceso exclusivo para administradores.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stack-form">
      <label>Cedula
        <input name="national_id" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required autocomplete="username">
      </label>
      <label>PIN
        <input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required autocomplete="current-password">
      </label>
      <button type="submit">Ingresar</button>
    </form>
  </section>
</main>
{% endblock %}
