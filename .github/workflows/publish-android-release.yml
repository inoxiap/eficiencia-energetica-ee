name: Publicar APK Android

on:
  push:
    branches:
      - "android-release/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto firmado
        uses: actions/checkout@v4

      - name: Validar y publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME#android-release/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La rama debe usar android-release/vX.Y.Z" >&2
            exit 1
          fi

          mapfile -t apks < <(find release-artifacts -maxdepth 1 -type f -name '*.apk')
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "Debe existir exactamente un APK en release-artifacts/." >&2
            exit 1
          fi

          apk="${apks[0]}"
          if [[ ! -s "$apk" ]]; then
            echo "El APK esta vacio." >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "main" \
              --title "Eficiencia Energetica EE ${tag#v}" \
              --notes "Actualizacion semiautomatica de Eficiencia Energetica EE para Android."
          fi
